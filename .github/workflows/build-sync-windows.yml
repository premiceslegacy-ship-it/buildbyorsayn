name: BUILD Sync Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/build-sync/**"
      - ".github/workflows/build-sync-windows.yml"

permissions:
  contents: read

jobs:
  installer-smoke:
    # Native Windows validation for the published PowerShell installer.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par empreinte de commit (v4.4.0) : une étiquette déplacée ne change pas le code exécuté.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Generate and verify published SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($artifact in @("build.mjs", "install.sh", "install.ps1")) {
            $path = Join-Path "public/build-sync" $artifact
            $checksumPath = "$path.sha256"
            $actual = (Get-FileHash -Algorithm SHA256 -Path $path).Hash
            [System.IO.File]::WriteAllText($checksumPath, "$actual  $artifact`n", [System.Text.UTF8Encoding]::new($false))
            $expected = ((Get-Content -Raw $checksumPath) -split "\s+")[0]
            if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or $actual.ToLowerInvariant() -ne $expected.ToLowerInvariant()) {
              throw "Published checksum mismatch for $artifact"
            }
            Write-Host "$artifact $actual"
          }
          git diff --exit-code -- public/build-sync/*.sha256
      - name: Verify BUILD Sync behavior
        run: node --import tsx --test tests/buildSync.test.ts
      - name: Parse and install BUILD Sync
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $null = [scriptblock]::Create((Get-Content -Raw public/build-sync/install.ps1))
          node --check public/build-sync/build.mjs
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", "public" -PassThru
          try {
            Start-Sleep -Seconds 2
            $env:BUILD_SYNC_BASE_URL = "http://127.0.0.1:8765"
            $env:BUILD_SYNC_INSTALL_ONLY = "1"
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "build-sync-localappdata"
            & ./public/build-sync/install.ps1
            $wrapper = Join-Path $env:LOCALAPPDATA "BUILD Sync/bin/build-skills.cmd"
            if (-not (Test-Path $wrapper)) { throw "BUILD Sync wrapper was not installed" }
            & $wrapper help
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
